<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagram SVG</title>
    <style>
        .svg-container {
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <div class="svg-container">
        <svg id="diagram" width="200" height="200" viewBox="-100 -100 200 200"></svg>
    </div>

    <script>
        const svg = document.getElementById("diagram");

        // Bar chart data
        const dataPoints = [3, 4, 7, 5, 3, 6];

        dataPoints.forEach((dataPoint, index) => {
            const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            rect.setAttribute("x", index * 20 - 55);
            rect.setAttribute("y", 50 - dataPoint * 10);
            rect.setAttribute("width", "15");
            rect.setAttribute("height", dataPoint * 10);
            rect.setAttribute("fill", "#CD803D");
            svg.appendChild(rect);
        });

        // Sine wave
        const sineWavePoints = Array.from({ length: 115 })
            .map((_, index) => {
            const x = index - 55;
            const y = Math.sin(index / 20) * 20 + 10;
            return `${x},${y}`;
            })
            .join(" ");

        const polyline = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
        polyline.setAttribute("points", sineWavePoints);
        polyline.setAttribute("fill", "none");
        polyline.setAttribute("stroke", "black");
        polyline.setAttribute("stroke-width", "5");

        svg.appendChild(polyline);
    </script>
</body>
</html>
